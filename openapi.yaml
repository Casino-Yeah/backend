openapi: 3.0.3
info:
  title: Casino Online API - Equipo 08
  version: 1.0.0
  description: |
    API REST del Casino Online (créditos virtuales). 25 endpoints en 6 módulos.

    **Autenticación:** inicia sesión en `POST /auth/login`, copia el `token` y pulsa **Authorize**.

    **Errores:** todas las respuestas de error tienen la forma `{ "mensaje": "...", "errores": [{ "campo", "mensaje" }] }`.
    400 datos inválidos · 401 sin sesión · 403 rol sin permiso · 404 no existe · 409 conflicto con una regla de negocio.

    **Reglas de negocio:** RN-01 registro solo mayores de 18 y bono de 1,000 · RN-02 límites de apuesta del juego ·
    RN-03 saldo nunca negativo · RN-04 recarga de 100 a 5,000 y máximo 20,000 al día · RN-05 solo juegos y usuarios activos,
    una partida en curso por juego · RN-06 el servidor calcula resultado y pago · RN-07 ajustes de saldo solo del administrador, con motivo.
servers:
  - url: /api
tags:
  - { name: M1 Autenticación }
  - { name: M2 Usuarios }
  - { name: M3 Juegos }
  - { name: M4 Billetera }
  - { name: M5 Apuestas }
  - { name: M6 Administración }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    pagina: { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    limite: { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
    dir: { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
    desde: { name: desde, in: query, schema: { type: string, format: date }, example: '2026-10-01' }
    hasta: { name: hasta, in: query, schema: { type: string, format: date }, example: '2026-10-31' }
    q: { name: q, in: query, description: Texto a buscar, schema: { type: string } }
  responses:
    Error400: { description: Datos inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Error401: { description: Sin sesión o token inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Error403: { description: El rol no tiene permiso, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Error404: { description: No encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Error409: { description: Conflicto con una regla de negocio, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      properties:
        mensaje: { type: string, example: Los datos enviados no son válidos }
        errores:
          type: array
          items: { type: object, properties: { campo: { type: string }, mensaje: { type: string } } }
    Paginacion:
      type: object
      properties: { pagina: { type: integer }, limite: { type: integer }, total: { type: integer }, paginas: { type: integer } }
    Usuario:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        correo: { type: string }
        fechaNacimiento: { type: string, format: date }
        rol: { type: string, enum: [admin, jugador] }
        activo: { type: boolean }
        saldo: { type: number, nullable: true }
        creadoEn: { type: string }
    Sesion:
      type: object
      properties: { token: { type: string }, usuario: { $ref: '#/components/schemas/Usuario' } }
    Juego:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string, example: blackjack }
        tipo: { type: string, enum: [blackjack, poker, ruleta, billar] }
        nombre: { type: string }
        descripcion: { type: string }
        apuestaMin: { type: number }
        apuestaMax: { type: number }
        activo: { type: boolean }
        apuestas: { type: integer, description: Número de apuestas registradas }
    JuegoEntrada:
      type: object
      properties:
        slug: { type: string, example: blackjack-vip }
        tipo: { type: string, enum: [blackjack, poker, ruleta, billar] }
        nombre: { type: string, example: Blackjack VIP }
        descripcion: { type: string }
        apuestaMin: { type: number, example: 500 }
        apuestaMax: { type: number, example: 5000 }
        activo: { type: boolean }
    Movimiento:
      type: object
      properties:
        id: { type: integer }
        tipo: { type: string, enum: [recarga, apuesta, premio, ajuste, bono] }
        monto: { type: number }
        saldoResultante: { type: number }
        apuestaId: { type: integer, nullable: true }
        descripcion: { type: string }
        creadoEn: { type: string }
    Partida:
      type: object
      properties:
        id: { type: integer }
        juego: { type: object, properties: { id: { type: integer }, nombre: { type: string }, tipo: { type: string } } }
        monto: { type: number }
        estado: { type: string, enum: [en_curso, ganada, perdida, empate] }
        multiplicador: { type: number, nullable: true }
        pago: { type: number }
        vista: { type: object, description: Estado visible del juego (cartas, rueda, bolas) }
        saldo: { type: number }

security:
  - bearer: []

paths:
  /auth/registro:
    post:
      tags: [M1 Autenticación]
      summary: 1. Registro de jugador (RN-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo, password, fechaNacimiento]
              properties:
                nombre: { type: string, example: Ana López }
                correo: { type: string, example: ana@correo.com }
                password: { type: string, example: Secreta123 }
                fechaNacimiento: { type: string, format: date, example: '2000-05-20' }
      responses:
        '201': { description: Jugador creado con bono de bienvenida, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '409': { $ref: '#/components/responses/Error409' }
  /auth/login:
    post:
      tags: [M1 Autenticación]
      summary: 2. Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password]
              properties:
                correo: { type: string, example: admin@casino.test }
                password: { type: string, example: Casino123 }
      responses:
        '200': { description: Token JWT, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /auth/perfil:
    get:
      tags: [M1 Autenticación]
      summary: 3. Perfil del usuario actual
      responses:
        '200': { description: Usuario, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '401': { $ref: '#/components/responses/Error401' }
  /auth/password:
    put:
      tags: [M1 Autenticación]
      summary: 4. Cambiar contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual, nueva]
              properties: { actual: { type: string }, nueva: { type: string } }
      responses:
        '200': { description: Contraseña actualizada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /usuarios:
    get:
      tags: [M2 Usuarios]
      summary: 5. Listar usuarios (búsqueda, filtros, orden y paginación)
      parameters:
        - $ref: '#/components/parameters/q'
        - { name: rol, in: query, schema: { type: string, enum: [admin, jugador] } }
        - { name: activo, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: orden, in: query, schema: { type: string, enum: [nombre, correo, creadoEn, saldo, id] } }
        - $ref: '#/components/parameters/dir'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Usuario' } }
                  paginacion: { $ref: '#/components/schemas/Paginacion' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [M2 Usuarios]
      summary: 7. Crear usuario (administrador o jugador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo, password, fechaNacimiento, rol]
              properties:
                nombre: { type: string }
                correo: { type: string }
                password: { type: string }
                fechaNacimiento: { type: string, format: date }
                rol: { type: string, enum: [admin, jugador] }
                activo: { type: boolean }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { $ref: '#/components/responses/Error409' }
  /usuarios/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [M2 Usuarios]
      summary: 6. Detalle de usuario con estadísticas
      responses:
        '200': { description: Usuario, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '404': { $ref: '#/components/responses/Error404' }
    put:
      tags: [M2 Usuarios]
      summary: 8. Editar usuario (datos, rol, activo, contraseña)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
                correo: { type: string }
                password: { type: string }
                fechaNacimiento: { type: string, format: date }
                rol: { type: string, enum: [admin, jugador] }
                activo: { type: boolean }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
    delete:
      tags: [M2 Usuarios]
      summary: 9. Dar de baja (desactivar) un usuario
      responses:
        '204': { description: Usuario desactivado }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /juegos:
    get:
      tags: [M3 Juegos]
      summary: 10. Listar juegos (el jugador solo ve los activos)
      parameters:
        - $ref: '#/components/parameters/q'
        - { name: tipo, in: query, schema: { type: string, enum: [blackjack, poker, ruleta, billar] } }
        - { name: activo, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: orden, in: query, schema: { type: string, enum: [nombre, apuestaMin, apuestaMax, creadoEn, apuestas] } }
        - $ref: '#/components/parameters/dir'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Página de juegos
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Juego' } }
                  paginacion: { $ref: '#/components/schemas/Paginacion' }
    post:
      tags: [M3 Juegos]
      summary: 12. Crear juego o variante con límites de apuesta
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JuegoEntrada' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Juego' } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { $ref: '#/components/responses/Error409' }
  /juegos/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [M3 Juegos]
      summary: 11. Detalle de un juego
      responses:
        '200': { description: Juego, content: { application/json: { schema: { $ref: '#/components/schemas/Juego' } } } }
        '404': { $ref: '#/components/responses/Error404' }
    put:
      tags: [M3 Juegos]
      summary: 13. Editar juego (límites, activo)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JuegoEntrada' } } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Juego' } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      tags: [M3 Juegos]
      summary: 14. Borrar juego (solo si no tiene apuestas)
      responses:
        '204': { description: Borrado }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /billetera:
    get:
      tags: [M4 Billetera]
      summary: 15. Saldo y límites de recarga del jugador
      responses:
        '200': { description: Billetera }
        '403': { $ref: '#/components/responses/Error403' }
  /billetera/recargas:
    post:
      tags: [M4 Billetera]
      summary: 16. Recargar créditos (RN-04)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [monto], properties: { monto: { type: number, example: 500 } } } } }
      responses:
        '201': { description: Recarga aplicada, content: { application/json: { schema: { type: object, properties: { saldo: { type: number }, movimientoId: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '409': { $ref: '#/components/responses/Error409' }
  /billetera/movimientos:
    get:
      tags: [M4 Billetera]
      summary: 17. Historial de movimientos del jugador
      parameters:
        - { name: tipo, in: query, schema: { type: string, enum: [recarga, apuesta, premio, ajuste, bono] } }
        - $ref: '#/components/parameters/desde'
        - $ref: '#/components/parameters/hasta'
        - $ref: '#/components/parameters/dir'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Página de movimientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Movimiento' } }
                  paginacion: { $ref: '#/components/schemas/Paginacion' }
  /usuarios/{id}/ajuste-saldo:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [M4 Billetera]
      summary: 18. Ajuste manual de saldo por el administrador (RN-07)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto, motivo]
              properties:
                monto: { type: number, example: -200, description: Positivo abona, negativo descuenta }
                motivo: { type: string, example: Corrección por falla del juego }
      responses:
        '200': { description: Ajuste aplicado }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { $ref: '#/components/responses/Error409' }

  /apuestas:
    post:
      tags: [M5 Apuestas]
      summary: 19. Apostar e iniciar una partida (transacción; RN-02, RN-03, RN-05, RN-06)
      description: |
        Descuenta el monto, crea la partida y, si el juego se resuelve de inmediato (Ruleta), abona el premio.
        Todo ocurre en una sola transacción: si algo falla, el saldo no cambia.
        Si ya hay una partida en curso del mismo juego responde 409 e incluye `partida` para continuarla.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [juegoId, monto]
              properties: { juegoId: { type: integer, example: 1 }, monto: { type: number, example: 50 } }
      responses:
        '201': { description: Partida creada, content: { application/json: { schema: { $ref: '#/components/schemas/Partida' } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
    get:
      tags: [M5 Apuestas]
      summary: 21. Historial de apuestas (jugador ve las suyas; administrador todas)
      parameters:
        - $ref: '#/components/parameters/q'
        - { name: usuarioId, in: query, schema: { type: integer } }
        - { name: juegoId, in: query, schema: { type: integer } }
        - { name: estado, in: query, schema: { type: string, enum: [en_curso, ganada, perdida, empate] } }
        - { name: orden, in: query, schema: { type: string, enum: [creadoEn, monto, pago, juego] } }
        - $ref: '#/components/parameters/desde'
        - $ref: '#/components/parameters/hasta'
        - $ref: '#/components/parameters/dir'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200': { description: Página de apuestas }
  /apuestas/{id}/acciones:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [M5 Apuestas]
      summary: 20. Jugada en una partida en curso
      description: |
        Blackjack `{ "accion": "pedir" }` o `{ "accion": "plantarse" }` ·
        Póker `{ "accion": "cambiar", "conservar": [0, 2] }` ·
        Billar `{ "accion": "tiro", "angulo": 0.1, "potencia": 0.8 }` (5 tiros; el servidor simula cada uno).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [pedir, plantarse, cambiar, tiro] }
                conservar: { type: array, items: { type: integer, minimum: 0, maximum: 4 } }
                angulo: { type: number }
                potencia: { type: number, minimum: 0.05, maximum: 1 }
      responses:
        '200': { description: Estado actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Partida' } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /admin/dashboard:
    get:
      tags: [M6 Administración]
      summary: 22. Indicadores y series para las gráficas (por defecto últimos 30 días)
      parameters: [{ $ref: '#/components/parameters/desde' }, { $ref: '#/components/parameters/hasta' }]
      responses:
        '200': { description: Dashboard }
        '403': { $ref: '#/components/responses/Error403' }
  /reportes/apuestas-por-juego:
    get:
      tags: [M6 Administración]
      summary: 23. Reporte 1 - Apuestas por juego en un rango de fechas (obligatorio)
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date }, example: '2026-10-01' }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date }, example: '2026-10-31' }
      responses:
        '200': { description: Reporte }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
  /reportes/jugadores:
    get:
      tags: [M6 Administración]
      summary: 24. Reporte 2 - Ranking de jugadores
      parameters:
        - $ref: '#/components/parameters/desde'
        - $ref: '#/components/parameters/hasta'
        - { name: orden, in: query, schema: { type: string, enum: [apostado, neto, apuestas, recargas, saldo, nombre] } }
        - $ref: '#/components/parameters/dir'
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Reporte }
        '403': { $ref: '#/components/responses/Error403' }
  /bitacora:
    get:
      tags: [M6 Administración]
      summary: 25. Bitácora de operaciones
      parameters:
        - $ref: '#/components/parameters/q'
        - { name: accion, in: query, schema: { type: string }, example: apuesta }
        - { name: entidad, in: query, schema: { type: string, enum: [usuario, juego, billetera, apuesta] } }
        - { name: usuarioId, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/desde'
        - $ref: '#/components/parameters/hasta'
        - $ref: '#/components/parameters/dir'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200': { description: Página de la bitácora }
        '403': { $ref: '#/components/responses/Error403' }
